<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Trend Analyzer Demo</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top right, rgba(145, 94, 255, .22), transparent 34%), #050816; color: #fff; display: grid; place-items: center; padding: 32px; }
      main { width: min(980px, 100%); border: 1px solid rgba(145,94,255,.35); border-radius: 24px; background: rgba(21,16,48,.86); box-shadow: 0 30px 90px rgba(0,0,0,.45); overflow: hidden; }
      .visual { min-height: 320px; background: linear-gradient(135deg, rgba(86,204,242,.18), rgba(145,94,255,.28)); display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 28px; }
      .panel { border: 1px solid rgba(255,255,255,.12); border-radius: 18px; background: rgba(5,8,22,.55); padding: 18px; }
      .bars { display: flex; align-items: end; gap: 12px; height: 150px; }
      .bar { width: 100%; border-radius: 10px 10px 4px 4px; background: linear-gradient(#f8d47a, #915eff); }
      .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
      .cell { height: 34px; border-radius: 8px; background: rgba(86,204,242,.28); }
      section { padding: 28px; }
      h1 { margin: 0; font-size: clamp(32px, 5vw, 56px); line-height: 1; }
      p { color: #aaa6c3; font-size: 17px; line-height: 1.7; }
      .tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
      .tag { border-radius: 999px; border: 1px solid rgba(248,212,122,.38); color: #f8d47a; padding: 8px 12px; font-weight: 700; }
      @media (max-width: 720px) { .visual { grid-template-columns: 1fr; } body { padding: 16px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="visual">
        <div class="panel">
          <strong>Views, likes, timing, and category growth</strong>
          <div class="bars">
            <span class="bar" style="height:42%"></span><span class="bar" style="height:72%"></span><span class="bar" style="height:58%"></span><span class="bar" style="height:86%"></span><span class="bar" style="height:66%"></span>
          </div>
        </div>
        <div class="panel">
          <strong>Pandas to visualization workflow</strong>
          <div class="grid" style="margin-top: 24px">
            <span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
            <span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
            <span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
          </div>
        </div>
      </div>
      <section>
        <h1>YouTube Trend Analyzer</h1>
        <p>Project demo showing how video metadata can be analyzed to discover trending patterns, engagement drivers, and category-level content opportunities.</p>
        <div class="tags"><span class="tag">Python</span><span class="tag">Pandas</span><span class="tag">Matplotlib</span><span class="tag">Analytics</span></div>
      </section>
    </main>
  </body>
</html>
